syntax = "proto3";
option go_package = "github.com/clubcedille/calidum-rotae-backend/pkg/proto-gen/github-provider;github_provider";

package github_provider;

//import "provider.proto";

message FetchPRRequest {
	string UserUID = 1;
}

message FetchPRResponse {
    string ActiveUserRequests = 1;
}

message WorkflowResponse {
    int64 WorkflowRunID = 1;
    string WorkflowRunUrl = 2;
}

message DeploymentRequest {
    string ClubName = 1;
    string Domain = 2;
    string Workflow = 3;
    string UserUID = 4;
}

message CedilleUserRequest {
  string GithubUsername = 1;
  string GithubEmail = 2;
  string ClusterRole = 3;
  string NetdataRole = 4;
  bool TeamSre = 5;
  string UserUID = 6;
}


service GithubProvider {
	// Get User pull requests
	rpc FetchPR(FetchPRRequest) returns (FetchPRResponse);

    // Add new outlines
    rpc RequestDeployment(DeploymentRequest) returns (WorkflowResponse);

    // Add new user to CEDILLE
    rpc AddCedilleUser(CedilleUserRequest) returns (WorkflowResponse);
}
